name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare pinned dependencies and ExifTool
        shell: pwsh
        run: .\prepare.ps1

      - name: Run automated tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: .\build.ps1

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $executable = 'dist\AI媒体标签工具.exe'
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Build output is missing: $executable"
          }
          $hash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AI媒体标签工具.exe" | Set-Content -LiteralPath 'dist\SHA256.txt' -Encoding ascii

      - name: Upload unsigned build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ai-media-tagger-windows-unsigned
          path: |
            dist/AI媒体标签工具.exe
            dist/SHA256.txt
          if-no-files-found: error

      # After SignPath Foundation approval, the artifact ID from the upload
      # step will be submitted with signpath/github-action-submit-signing-request.
      # Organization/project/policy identifiers are intentionally not guessed
      # or committed before SignPath provisions the OSS subscription.
