name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare pinned dependencies and ExifTool
        shell: pwsh
        run: |
          python -m venv .train_venv
          .\prepare.ps1

      - name: Run automated tests
        shell: pwsh
        run: .\.train_venv\Scripts\python.exe -m pytest -q

      - name: Build Windows application
        shell: pwsh
        run: .\build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\installer.iss"'

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = 'dist_installer\AI媒体标签工具安装程序.exe'
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Build output is missing: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AI媒体标签工具安装程序.exe" | Set-Content -LiteralPath 'dist_installer\SHA256.txt' -Encoding ascii

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-media-tagger-windows-installer-unsigned
          path: |
            dist_installer/AI媒体标签工具安装程序.exe
            dist_installer/SHA256.txt
          if-no-files-found: error
